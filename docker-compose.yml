
services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped
    networks:
      - secure-net
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: juice-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - juice-shop
    networks:
      - secure-net

networks:
  secure-net:
    driver: bridge
